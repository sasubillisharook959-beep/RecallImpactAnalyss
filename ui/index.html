<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall Impact Analysis – DAA Project</title>
<style>
:root{--ink:#23251c;--mute:#6b6e5d;--line:#d9dbcf;--bg:#f2f3ee;--card:#fff;--olive:#4a4519;--olive2:#7a7330;--gold:#c9a227;--red:#b42318;--blue:#1f6f8b;--grey:#c7c9bd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:10px 24px;flex-wrap:wrap}
header img{height:46px}
header h1{font:700 21px Cambria,Georgia,serif;margin:0;color:var(--olive)}
header p{margin:0;color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:330px 1fr;gap:16px;padding:16px 24px;max-width:1500px;margin:auto}
@media(max-width:920px){main{grid-template-columns:1fr;padding:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font:700 16px Cambria,Georgia,serif;margin:0 0 10px;color:var(--olive)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{flex:1 1 auto;border:1px solid var(--line);background:var(--card);padding:8px 10px;border-radius:6px;font:inherit;cursor:pointer;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--olive);color:#fff;border-color:var(--olive)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
select,input[type=text],input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--olive);background:var(--olive);color:#fff;padding:7px 14px;border-radius:6px;font:inherit;cursor:pointer}
.btn.alt{background:#fff;color:var(--olive)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.chips span{display:inline-block;background:#eef0e4;border:1px solid var(--line);border-radius:5px;padding:1px 9px;margin:2px 4px 2px 0;font-weight:600}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:8px 0}
.stats b{font:700 26px Cambria,Georgia,serif;color:var(--olive);display:block}
.stats small{color:var(--mute)}
.log{max-height:170px;overflow:auto;font:13px/1.5 Consolas,"Courier New",monospace;background:#f7f8f3;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.bar{height:14px;background:var(--olive2);border-radius:3px}
.node{cursor:pointer}.node text{font:600 12px "Segoe UI",Arial,sans-serif;pointer-events:none}
@media(prefers-reduced-motion:no-preference){.node circle,.edge{transition:fill .25s,stroke .25s,opacity .25s}}
</style></head>

<script>

/* ================= ENGINE (same algorithms as src/main.cpp) ================= */
const inferType=n=>({H:"Hospital",W:"Warehouse",B:"Batch"})[n[0]]||"Unknown";
function newNet(){return{names:[],type:[],adj:[],radj:[],id:new Map()}}
function node(net,n,t){let i=net.id.get(n);if(i===undefined){i=net.names.length;net.id.set(n,i);net.names.push(n);net.type.push(inferType(n));net.adj.push([]);net.radj.push([])}if(t)net.type[i]=t;return i}
function addEdge(net,a,b){const u=node(net,a),v=node(net,b);if(net.adj[u].includes(v))return false;net.adj[u].push(v);net.radj[v].push(u);return true}
function parseCSV(text){const net=newNet();text.split(/\r?\n/).slice(1).forEach(l=>{const[a,t,c]=l.split(",").map(x=>(x||"").trim());if(!a||!c)return;const A=a.toUpperCase(),C=c.toUpperCase();node(net,A,t||inferType(A));node(net,C,inferType(C));addEdge(net,A,C)});return net}
function bfs(net,s){const d=Array(net.names.length).fill(-1),p=Array(net.names.length).fill(-1),order=[],q=[s];d[s]=0;
 for(let h=0;h<q.length;h++){const u=q[h];order.push(u);for(const v of net.adj[u])if(d[v]<0){d[v]=d[u]+1;p[v]=u;q.push(v)}}return{order,d,p}}
function traceback(net,s){const seen=new Set([s]),q=[s];for(let h=0;h<q.length;h++)for(const v of net.radj[q[h]])if(!seen.has(v)){seen.add(v);q.push(v)}return seen}
class DSU{constructor(n){this.p=[...Array(n).keys()];this.r=Array(n).fill(0)}
 find(x){while(this.p[x]!==x){this.p[x]=this.p[this.p[x]];x=this.p[x]}return x}
 unite(a,b){a=this.find(a);b=this.find(b);if(a===b)return false;if(this.r[a]<this.r[b])[a,b]=[b,a];this.p[b]=a;if(this.r[a]===this.r[b])this.r[a]++;return true}}
const edgeList=net=>net.adj.flatMap((vs,u)=>vs.map(v=>[u,v]));
function clusters(net,upTo){const d=new DSU(net.names.length);edgeList(net).slice(0,upTo).forEach(([u,v])=>d.unite(u,v));const m=new Map();net.names.forEach((_,i)=>{const r=d.find(i);(m.get(r)||m.set(r,[]).get(r)).push(i)});return{dsu:d,groups:[...m.values()].map(g=>g.map(i=>net.names[i]).sort()).sort((a,b)=>a[0]<b[0]?-1:1)}}
function synthetic(nb,nw,nh){const n=newNet();let s=42;const r=m=>(s=(s*1103515245+12345)>>>0,(s>>>8)%m);
 for(let b=0;b<nb;b++)for(let k=0;k<3;k++)addEdge(n,"B"+b,"W"+r(nw));for(let w=0;w<nw;w++)for(let k=0;k<2;k++)addEdge(n,"W"+w,"H"+r(nh));return n}
function bench(net,Q){const bs=net.names.map((_,i)=>i).filter(i=>net.type[i]==="Batch");let t=performance.now(),c1=0;
 for(let q=0;q<Q;q++)c1+=bfs(net,bs[q%bs.length]).order.length;const bfsMs=performance.now()-t;t=performance.now();
 const d=new DSU(net.names.length);edgeList(net).forEach(([u,v])=>d.unite(u,v));let c2=0;for(let q=0;q<Q;q++)c2+=d.find(bs[q%bs.length])>=0;
 return{bfsMs,dsuMs:performance.now()-t,c1,c2,V:net.names.length,E:edgeList(net).length}}
window.RecallEngine={parseCSV,bfs,traceback,clusters,synthetic,bench,SAMPLE};

/* ================= UI ================= */
const $=s=>document.querySelector(s);
const S={net:parseCSV(SAMPLE),mode:"recall",batch:null,step:0,target:null,from:null,node:null,playing:null,uSteps:0};
const PAL=["#1f6f8b","#b8860b","#7a3e9d","#2e7d32","#c2410c","#0f766e","#be185d","#4d4d99"];
const MODES=[["recall","Recall (BFS)"],["trace","Traceback"],["path","Delivery path"],["clusters","Clusters (DSU)"],["bench","Benchmark"]];
const batches=()=>S.net.names.filter((_,i)=>S.net.type[i]==="Batch");
const nonBatch=()=>S.net.names.filter((_,i)=>S.net.type[i]!=="Batch");
const opts=(arr,sel)=>arr.map(x=>`<option${x===sel?" selected":""}>${x}</option>`).join("");
function ensure(){const b=batches(),o=nonBatch();if(!b.includes(S.batch))S.batch=b[0]||null;if(!S.net.id.has(S.node))S.node=o[o.length-1]||null;
 if(!S.net.id.has(S.target))S.target=o[o.length-1]||null;if(!b.includes(S.from))S.from=b[0]||null}
function stop(){clearInterval(S.playing);S.playing=null}

function layout(){const cols={Batch:0,Warehouse:1,Hospital:2,Unknown:2},rows=[0,0,0],pos={};
 S.net.names.forEach((n,i)=>{const c=cols[S.net.type[i]];pos[n]={x:[110,450,790][c],y:58+rows[c]++*46,c}});
 return{pos,h:Math.max(...rows,4)*46+56}}

function recallData(){const net=S.net;if(S.batch==null)return null;const r=bfs(net,net.id.get(S.batch)),idx=new Map(r.order.map((n,i)=>[n,i]));return{...r,idx}}
function render(){ensure();renderTabs();renderPanel();renderGraph();renderResults()}
function renderTabs(){$("#tabs").innerHTML=MODES.map(([k,t])=>`<button role="tab" aria-selected="${S.mode===k}" data-m="${k}">${t}</button>`).join("");
 $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{stop();S.mode=b.dataset.m;S.step=0;S.uSteps=0;render()})}

function renderPanel(){const P=$("#panel"),b=batches(),o=nonBatch();let h="";
 if(S.mode==="recall"){const R=recallData(),n=R?R.order.length:0;
  h=`<h2>Recall a contaminated batch</h2><label for="selB">Recalled batch</label><select id="selB">${opts(b,S.batch)}</select>
  <div class="row"><button class="btn" id="stepB">Step</button><button class="btn alt" id="playB">${S.playing?"Pause":"Play"}</button><button class="btn alt" id="allB">Show all</button><button class="btn alt" id="rstB">Reset</button></div>
  <p class="note">BFS visits one node per step. Nodes waiting in the queue have a dashed outline. Visited: <b>${Math.min(S.step,n)}</b> of ${n}.</p>`}
 if(S.mode==="trace")h=`<h2>Traceback from a node</h2><label for="selN">Node where a problem was found</label><select id="selN">${opts(o,S.node)}</select><p class="note">Runs BFS on the reversed shipments to list every batch that could have reached this node.</p>`;
 if(S.mode==="path")h=`<h2>Delivery path</h2><label for="selF">From batch</label><select id="selF">${opts(b,S.from)}</select><label for="selT">To node</label><select id="selT">${opts(o,S.target)}</select><p class="note">The shortest chain of shipments, taken from the BFS parent pointers.</p>`;
 if(S.mode==="clusters"){const E=edgeList(S.net).length;
  h=`<h2>Union-Find clusters</h2><div class="row" style="margin-top:0"><button class="btn" id="stepU">Next union</button><button class="btn alt" id="playU">${S.playing?"Pause":"Play"}</button><button class="btn alt" id="allU">Show all</button><button class="btn alt" id="rstU">Reset</button></div>
  <p class="note">Each shipment is united as an undirected link. Unions applied: <b>${S.uSteps}</b> of ${E}.</p>`}
 if(S.mode==="bench")h=`<h2>BFS vs Union-Find</h2><label for="qN">Number of queries</label><input type="number" id="qN" value="5000" min="100" max="200000"><label for="bigN">Network size</label><select id="bigN"><option value="cur">Current network</option><option value="big">Synthetic: 21,000 nodes</option></select><div class="row"><button class="btn" id="runBench">Run benchmark</button></div><p class="note">Timings come from this browser and vary between runs.</p>`;
 P.innerHTML=h;const on=(id,f)=>{const e=$("#"+id);if(e)e.onclick=f};
 const sel=(id,f)=>{const e=$("#"+id);if(e)e.onchange=()=>{stop();f(e.value);S.step=0;render()}};
 sel("selB",v=>S.batch=v);sel("selN",v=>S.node=v);sel("selF",v=>S.from=v);sel("selT",v=>S.target=v);
 const tick=(max,get,set,id)=>{if(S.playing){stop();render();return}S.playing=setInterval(()=>{if(get()>=max){stop();render();return}set(get()+1);render()},650);render()};
 on("stepB",()=>{const R=recallData();if(R&&S.step<R.order.length){S.step++;render()}});
 on("playB",()=>{const R=recallData();if(!R)return;if(S.step>=R.order.length)S.step=0;tick(R.order.length,()=>S.step,v=>S.step=v)});
 on("allB",()=>{stop();S.step=1e9;render()});on("rstB",()=>{stop();S.step=0;render()});
 const E=edgeList(S.net).length;on("stepU",()=>{if(S.uSteps<E){S.uSteps++;render()}});
 on("playU",()=>{if(S.uSteps>=E)S.uSteps=0;tick(E,()=>S.uSteps,v=>S.uSteps=v)});
 on("allU",()=>{stop();S.uSteps=E;render()});on("rstU",()=>{stop();S.uSteps=0;render()});
 on("runBench",runBench)}

function colorFor(i){return "#c7c9bd"}
function renderGraph(){const net=S.net,L=layout(),W=900;let hl={node:{},edge:{}},label=null;
 const set=(n,fill,stroke,dash)=>hl.node[n]={fill,stroke,dash};
 if(S.mode==="recall"){const R=recallData();if(R){const k=Math.min(S.step,R.order.length);const vis=new Set(R.order.slice(0,k).map(i=>net.names[i]));
  R.order.forEach((u,i)=>{const n=net.names[u];if(i<k)set(n,i===0?"#b42318":net.type[u]==="Hospital"?"#1f6f8b":"#c9a227","#23251c");
   else if(R.p[u]>=0&&R.idx.get(R.p[u])<k||i===0&&k===0&&false)set(n,"#fff","#c9a227",true)});
  if(k===0)set(S.batch,"#fff","#c9a227",true);
  R.order.slice(0,k).forEach(u=>{const p=R.p[u];if(p>=0)hl.edge[net.names[p]+">"+net.names[u]]="#b42318"})}}
 if(S.mode==="trace"&&S.node){const s=traceback(net,net.id.get(S.node));s.forEach(i=>set(net.names[i],net.type[i]==="Batch"?"#b42318":"#c9a227","#23251c"));set(S.node,"#1f6f8b","#23251c");
  edgeList(net).forEach(([u,v])=>{if(s.has(u)&&s.has(v))hl.edge[net.names[u]+">"+net.names[v]]="#b42318"})}
 if(S.mode==="path"&&S.from&&S.target){const r=bfs(net,net.id.get(S.from));let v=net.id.get(S.target);if(r.d[v]>=0){for(;v!==-1;v=r.p[v]){set(net.names[v],"#c9a227","#23251c");if(r.p[v]>=0)hl.edge[net.names[r.p[v]]+">"+net.names[v]]="#b42318"}set(S.from,"#b42318","#23251c");set(S.target,"#1f6f8b","#23251c")}}
 if(S.mode==="clusters"){const C=clusters(net,S.uSteps),m=new Map();C.groups.forEach((g,gi)=>{if(g.length>1)g.forEach(n=>set(n,PAL[gi%PAL.length],"#23251c"))});
  edgeList(net).slice(0,S.uSteps).forEach(([u,v])=>hl.edge[net.names[u]+">"+net.names[v]]=hl.node[net.names[u]].fill)}
 let s=`<svg viewBox="0 0 ${W} ${L.h}" id="graph" role="img" aria-label="Supply network graph"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9a9d8c"/></marker><marker id="ar2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#b42318"/></marker></defs>`;
 [["Batches",110],["Warehouses",450],["Hospitals",790]].forEach(([t,x])=>s+=`<text x="${x}" y="18" text-anchor="middle" fill="#6b6e5d" font-size="13" font-weight="600">${t}</text>`);
 edgeList(net).forEach(([u,v])=>{const a=L.pos[net.names[u]],b=L.pos[net.names[v]],key=net.names[u]+">"+net.names[v],c=hl.edge[key],m=(a.x+b.x)/2;
  s+=`<path class="edge" d="M${a.x+19} ${a.y}C${m} ${a.y} ${m} ${b.y} ${b.x-25} ${b.y}" fill="none" stroke="${c||"#c3c6b8"}" stroke-width="${c?2.6:1.4}" opacity="${c?1:.8}" marker-end="url(#${c?"ar2":"ar"})"/>`});
 net.names.forEach(n=>{const p=L.pos[n],h=hl.node[n]||{fill:"#fff",stroke:"#9a9d8c"},dark=h.fill!=="#fff"&&h.fill!=="#c9a227";
  s+=`<g class="node" data-n="${n}" tabindex="0"><circle cx="${p.x}" cy="${p.y}" r="18" fill="${h.fill}" stroke="${h.stroke}" stroke-width="2" ${h.dash?'stroke-dasharray="4 3"':""}/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" fill="${dark?"#fff":"#23251c"}">${n}</text></g>`});
 $("#graph").outerHTML=s+"</svg>";
 document.querySelectorAll(".node").forEach(g=>{const f=()=>pick(g.dataset.n);g.onclick=f;g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
 const leg={recall:[["#b42318","Recalled batch"],["#c9a227","Warehouse reached"],["#1f6f8b","Hospital reached"],["#fff","Queued / untouched"]],trace:[["#1f6f8b","Selected node"],["#b42318","Source batch"],["#c9a227","Intermediate"]],path:[["#b42318","Batch"],["#c9a227","Via"],["#1f6f8b","Destination"]],clusters:[["#1f6f8b","Colours mark merged sets"]],bench:[]}[S.mode];
 $("#legend").innerHTML=leg.map(([c,t])=>`<span><i style="background:${c};border:1px solid #9a9d8c"></i>${t}</span>`).join("")+"<span>Click a node to select it.</span>"}
function pick(n){const t=S.net.type[S.net.id.get(n)];stop();
 if(S.mode==="recall"&&t==="Batch"){S.batch=n;S.step=0}else if(S.mode==="trace"&&t!=="Batch")S.node=n;
 else if(S.mode==="path"){if(t==="Batch")S.from=n;else S.target=n}render()}

const chips=a=>a.length?`<div class="chips">${a.map(x=>`<span>${x}</span>`).join("")}</div>`:"<p class=note>None</p>";
function renderResults(){const net=S.net,R=$("#results");let h="";
 if(S.mode==="recall"){const r=recallData();if(!r){R.innerHTML="<h2>Results</h2><p>The network has no batches. Add a shipment that starts at a batch such as B105.</p>";return}
  const k=Math.min(S.step,r.order.length),seen=r.order.slice(0,k),T=t=>seen.filter(u=>net.type[u]===t).map(u=>net.names[u]);
  const q=r.order.filter((u,i)=>i>=k&&r.p[u]>=0&&r.idx.get(r.p[u])<k).map(u=>net.names[u]);
  const mx=Math.max(...seen.map(u=>r.d[u]),0);
  h=`<h2>Recall of ${S.batch}</h2><div class="stats"><div><b>${T("Warehouse").length}</b><small>warehouses affected</small></div><div><b>${T("Hospital").length}</b><small>hospitals affected</small></div><div><b>${mx}</b><small>hops from batch</small></div></div>
  <p><b>Warehouses</b></p>${chips(T("Warehouse"))}<p><b>Hospitals</b></p>${chips(T("Hospital"))}<p><b>BFS queue now:</b> ${q.length?q.join(", "):(k===0?"(press Step to start)":"empty")}</p>`}
 if(S.mode==="trace"&&S.node){const s=[...traceback(net,net.id.get(S.node))].map(i=>net.names[i]).filter(n=>net.type[net.id.get(n)]==="Batch").sort();h=`<h2>Traceback for ${S.node}</h2><p>Batches that can have reached this node:</p>${chips(s)}<p class="note">${s.length===1?"One batch is the only possible source, so recalling it is enough.":s.length?"Several batches converge here; check which one was actually delivered.":"No batch reaches this node."}</p>`}
 if(S.mode==="path"&&S.from&&S.target){const r=bfs(net,net.id.get(S.from));let v=net.id.get(S.target);const p=[];if(r.d[v]>=0)for(;v!==-1;v=r.p[v])p.unshift(net.names[v]);
  h=`<h2>Delivery path</h2>${p.length?`<p>${p.join(" → ")}</p><p class="note">${p.length-1} hops</p>`:`<p>No delivery path from ${S.from} to ${S.target}. They are not linked by directed shipments.</p>`}`}
 if(S.mode==="clusters"){const C=clusters(net,S.uSteps),E=edgeList(net);let log="";
  E.slice(0,S.uSteps).forEach(([u,v],i)=>{log+=`${i+1}. union(${net.names[u]}, ${net.names[v]})<br>`});
  const multi=C.groups.filter(g=>g.length>1);
  h=`<h2>Clusters</h2><div class="stats"><div><b>${C.groups.length}</b><small>disjoint sets now</small></div><div><b>${S.uSteps}</b><small>unions applied</small></div></div>${S.uSteps?multi.map(g=>`<p><b>${g.length} nodes:</b> ${g.join(", ")}</p>`).join(""):"<p>Press Next union to start merging nodes connected by shipments.</p>"}<div class="log" id="ulog">${log||"No unions yet."}</div>`}
 if(S.mode==="bench")h=`<h2>Benchmark</h2><p id="benchOut">Run the benchmark to compare repeated BFS recalls with Union-Find queries.</p>`;
 R.innerHTML=h;const l=$("#ulog");if(l)l.scrollTop=l.scrollHeight}
function runBench(){const Q=Math.max(100,+$("#qN").value||5000),big=$("#bigN").value==="big",net=big?synthetic(2000,8000,20000):S.net;
 $("#benchOut").textContent="Running…";setTimeout(()=>{const r=bench(net,Q),mx=Math.max(r.bfsMs,r.dsuMs,1e-6),sp=r.dsuMs>0?(r.bfsMs/r.dsuMs).toFixed(1):"–";
  $("#benchOut").innerHTML=`<p>${r.V.toLocaleString()} nodes, ${r.E.toLocaleString()} edges, ${Q.toLocaleString()} queries.</p><table><tr><th>Method</th><th>Time</th><th style="width:45%"></th></tr>
  <tr><td>Repeated BFS<br><small>O(V+E) per query</small></td><td>${r.bfsMs.toFixed(2)} ms</td><td><div class="bar" style="width:${100*r.bfsMs/mx}%;background:var(--red)"></div></td></tr>
  <tr><td>Union-Find build + queries<br><small>O(E·α(V)) build, O(α(V)) per query</small></td><td>${r.dsuMs.toFixed(2)} ms</td><td><div class="bar" style="width:${Math.max(1,100*r.dsuMs/mx)}%"></div></td></tr></table>
  <p><b>Speed-up: ${sp}×.</b> BFS finds the directed downstream set. Union-Find only says which cluster a batch belongs to, so it is a faster but coarser answer.</p>`},30)}

/* ---- network editing ---- */
const msg=(t,bad)=>{const e=$("#editMsg");e.textContent=t;e.style.color=bad?"var(--red)":"var(--mute)"};
$("#addBtn").onclick=()=>{const a=$("#addFrom").value.trim().toUpperCase(),b=$("#addTo").value.trim().toUpperCase();
 if(!a||!b)return msg("Enter both a source and a target node.",1);if(a===b)return msg("A node cannot ship to itself.",1);
 if(addEdge(S.net,a,b)){msg(`Added ${a} → ${b}.`);$("#addFrom").value=$("#addTo").value="";S.step=0;S.uSteps=0;render()}else msg("That shipment already exists.",1)};
$("#resetBtn").onclick=()=>{stop();S.net=parseCSV(SAMPLE);S.step=S.uSteps=0;S.batch=null;msg("Sample network restored.");render()};
$("#csvFile").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const n=parseCSV(t);if(!n.names.length)return msg("No shipments found. Expected columns: source,type,target.",1);stop();S.net=n;S.step=S.uSteps=0;S.batch=null;msg(`Loaded ${n.names.length} nodes from ${f.name}.`);render()})};
$("#dlBtn").onclick=()=>{const rows=["source,type,target",...edgeList(S.net).map(([u,v])=>`${S.net.names[u]},${S.net.type[u]},${S.net.names[v]}`)];
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")+"\n"],{type:"text/csv"}));a.download="network.csv";a.click()};
render();
</script></body></html>
